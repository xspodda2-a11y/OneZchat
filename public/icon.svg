<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="OneZchat">
  <defs>
    <linearGradient id="ozm-obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b24"/>
      <stop offset="0.55" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="ozm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbeed0"/>
      <stop offset="0.38" stop-color="#e3c896"/>
      <stop offset="0.62" stop-color="#c9a468"/>
      <stop offset="1" stop-color="#8d6a3a"/>
    </linearGradient>
    <linearGradient id="ozm-jewel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2ff0b4"/>
      <stop offset="0.45" stop-color="#00c389"/>
      <stop offset="1" stop-color="#00694e"/>
    </linearGradient>
    <linearGradient id="ozm-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ozm-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e0a4" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#00b4d8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ozm-bubble-clip">
      <path d="M84,70 H156 A28,28 0 0 1 184,98 V130 A28,28 0 0 1 156,158 H108 L72,184 L86,158 H84 A28,28 0 0 1 56,130 V98 A28,28 0 0 1 84,70 Z"/>
    </clipPath>
  </defs>

  <!-- full-bleed obsidian (maskable safe) -->
  <rect width="240" height="240" fill="url(#ozm-obsidian)"/>
  <ellipse cx="120" cy="122" rx="98" ry="86" fill="url(#ozm-halo)"/>

  <!-- emblem, scaled into the 66% safe zone -->
  <g transform="translate(120,120) scale(0.72) translate(-120,-120)">
    <g>
      <path d="M84,70 H156 A28,28 0 0 1 184,98 V130 A28,28 0 0 1 156,158 H108 L72,184 L86,158 H84 A28,28 0 0 1 56,130 V98 A28,28 0 0 1 84,70 Z"
            fill="url(#ozm-jewel)"/>
      <g clip-path="url(#ozm-bubble-clip)">
        <rect x="50" y="64" width="140" height="60" fill="url(#ozm-gloss)"/>
        <ellipse cx="150" cy="168" rx="62" ry="34" fill="#003d2c" opacity="0.35"/>
      </g>
      <path d="M84,70 H156 A28,28 0 0 1 184,98 V130 A28,28 0 0 1 156,158 H108 L72,184 L86,158 H84 A28,28 0 0 1 56,130 V98 A28,28 0 0 1 84,70 Z"
            fill="none" stroke="url(#ozm-gold)" stroke-opacity="0.55" stroke-width="2.2"/>
    </g>
    <g>
      <path d="M120,84 C123.4,101.6 136.4,114.6 154,118 C136.4,121.4 123.4,134.4 120,152 C116.6,134.4 103.6,121.4 86,118 C103.6,114.6 116.6,101.6 120,84 Z"
            fill="url(#ozm-gold)"/>
      <circle cx="160" cy="90" r="5" fill="url(#ozm-gold)" opacity="0.9"/>
    </g>
  </g>
</svg>
